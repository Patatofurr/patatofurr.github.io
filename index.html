        Julie Betrancourt accueille adultes, enfants, nourrissons, personnes enceintes et post-partum
        dans une approche fondée sur l'écoute, le soin et la confiance.
      </p>
      <p>

        Les consultations peuvent aussi se faire en anglais.
        Le cadre de soin se veut inclusif et LGBT+ friendly.
      </p>

      </p>
